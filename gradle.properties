android.useAndroidX=true
android.enableJetifier=true
kotlin.compiler.incremental=true
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m
android.experimental.enableNewJdkImageTransform=false
org.gradle.configuration-cache=false
# backdrop-android 2.0.0 要求 minCompileSdk=37，而 AGP 8.10.0 官方只推荐到 36。
# 本地已装 android-37 平台且实测可编译，此处显式放行（仅影响编译期 API 可见性，
# targetSdk 仍为 36，不改变任何运行期行为）。
android.suppressUnsupportedCompileSdk=37
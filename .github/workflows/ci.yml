name: 编译

# 每次推送 / PR 都编一份 Debug APK，确保主线始终可构建。
#
# 编译逻辑（缓存策略 + 增量优先 + 全量降级重试 + 失败判定）收敛到
# ./.github/actions/gradle-build，与 release_apk.yml 共用同一份实现，
# 两条流程的错误处理语义因此天然一致。
on:
  push:
    paths-ignore:
      - 'README.md'
      - 'CHANGELOG.md'
  pull_request:
    paths-ignore:
      - 'README.md'
      - 'CHANGELOG.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: "Debug APK"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      # 项目 sourceCompatibility / jvmTarget 均为 17，但 AGP 8.10 + Gradle 8.13
      # 在 JDK 21 下已验证可构建，故用 21 以获得更好的 Kotlin 编译性能。
      #
      # 刻意**不启用** setup-java 的 cache: gradle：
      #   1) 它内部走 actions/cache，PR 上会无条件回写，挤占仓库 10GB 配额
      #      把主线条目挤出 LRU（缓存隔离要求 PR 只读）；
      #   2) 它只覆盖 ~/.gradle，而下面的 gradle-build action 已完整缓存
      #      ~/.gradle/{caches,wrapper} + **/build —— 留着是重复覆盖。
      - name: 设置 JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: 编译 Debug APK（增量优先，失败自动全量重试一次）
        uses: ./.github/actions/gradle-build
        with:
          gradle-task: ':app:assembleDebug'
          variant: debug
          artifact-glob: 'app/build/outputs/apk/debug/*.apk'

      - name: 上传 Debug APK
        uses: actions/upload-artifact@v7
        with:
          name: SuperSPM-debug
          archive: false
          if-no-files-found: error
          path: app/build/outputs/apk/debug/*.apk
